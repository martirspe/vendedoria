name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendedoria?schema=public
      - run: npm run build:api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendedoria?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-chars
          JWT_REFRESH_SECRET: ci-refresh-secret-must-be-at-least-32-chars
      - run: npm run build:web
