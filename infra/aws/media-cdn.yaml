AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  VendedorIA product media: private S3 bucket served only through CloudFront (Origin Access
  Control), plus the least-privilege IAM policy the API uses to upload and delete photos.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Application }
        Parameters: [AppName, Environment, MediaPrefix, AppUserName]
      - Label: { default: CloudFront }
        Parameters: [AliasDomain, AcmCertificateArn, PriceClass, WebAclArn]
      - Label: { default: Storage }
        Parameters: [NoncurrentVersionDays]

Parameters:
  AppName:
    Type: String
    Default: vendedoria
    AllowedPattern: '^[a-z0-9-]{3,20}$'
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  MediaPrefix:
    Type: String
    Default: media
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Key prefix written by the API (MediaService uses "media").
  AppUserName:
    Type: String
    Default: ''
    Description: Existing IAM user of the API to attach the policy to (empty when using an instance role).
  AliasDomain:
    Type: String
    Default: ''
    Description: Custom media domain, e.g. media.example.pe (requires AcmCertificateArn).
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for AliasDomain, issued in us-east-1.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_All includes South American edge locations.
  WebAclArn:
    Type: String
    Default: ''
    Description: Optional AWS WAF web ACL (CLOUDFRONT scope, created in us-east-1).
  NoncurrentVersionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Recovery window for deleted or overwritten photos.

Conditions:
  HasAlias: !And
    - !Not [!Equals [!Ref AliasDomain, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]
  HasWaf: !Not [!Equals [!Ref WebAclArn, '']]
  HasAppUser: !Not [!Equals [!Ref AppUserName, '']]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-media-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionDays
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-healthchecks
            Status: Enabled
            Prefix: !Sub '${MediaPrefix}/_healthcheck/'
            ExpirationInDays: 1
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: environment, Value: !Ref Environment }

  MediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-${Environment}-media'
        Description: Signs CloudFront requests to the private media bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AppName} ${Environment} product media'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasAlias, [!Ref AliasDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasAlias
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWaf, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: media-bucket
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MediaOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: media-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honours the immutable Cache-Control set on upload.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy: HSTS, nosniff, frame and referrer headers.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
      Tags:
        - { Key: app, Value: !Ref AppName }
        - { Key: environment, Value: !Ref Environment }

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/${MediaPrefix}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  AppMediaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AppName}-${Environment}-api-media'
      Description: Lets the API upload and delete product photos, nothing else.
      Users: !If [HasAppUser, [!Ref AppUserName], !Ref AWS::NoValue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageProductMedia
            Effect: Allow
            Action: [s3:PutObject, s3:DeleteObject]
            Resource: !Sub '${MediaBucket.Arn}/${MediaPrefix}/*'

Outputs:
  MediaBucketName:
    Description: MEDIA_S3_BUCKET
    Value: !Ref MediaBucket
  BucketRegion:
    Description: AWS_REGION
    Value: !Ref AWS::Region
  MediaCdnUrl:
    Description: MEDIA_CDN_URL (point the alias DNS record at DistributionDomainName first)
    Value: !If
      - HasAlias
      - !Sub 'https://${AliasDomain}'
      - !Sub 'https://${MediaDistribution.DomainName}'
  DistributionId:
    Description: CLOUDFRONT_DISTRIBUTION_ID (audit script)
    Value: !Ref MediaDistribution
  DistributionDomainName:
    Description: CNAME / alias target for AliasDomain
    Value: !GetAtt MediaDistribution.DomainName
  AppMediaPolicyArn:
    Description: Attach to the API's IAM user or instance role
    Value: !Ref AppMediaPolicy
