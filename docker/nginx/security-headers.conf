# Cabeceras de seguridad de la consola. Ninguna location debe usar add_header:
# nginx descartaría estas cabeceras heredadas.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# La Content-Security-Policy va en cada server de default.conf.template: la consola enmarca las
# tiendas en el editor de diseño y la web comercial no.
